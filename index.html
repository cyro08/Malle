
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown bis lecker Bierchen 🍻</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin-top: 20%;

  background-image: url("index.png");
  background-size: cover;        /* Bild füllt den ganzen Bildschirm */
  background-position: center;   /* zentriert */
  background-repeat: no-repeat;  /* nicht wiederholen */
}

#countdown {
  font-size: 1.8em;
  margin-top: 20px;
  color: #0078D4;
}


h1 {
  color: white;
}


  </style>
</head>
<body>
  <h1>Countdown bis Lecker Bierchen 🍻</h1>

  <div id="countdown">Lädt...</div>

  <script>
    function updateCountdown() {
      const now = new Date();
      const year = now.getFullYear();

      let target = new Date(year, 6, 9, 0, 0, 0);
      if (now > target) {
        target = new Date(year + 1, 6, 9, 0, 0, 0);
      }

      const diff = target - now;

      if (diff <= 0) {
        document.getElementById("countdown").innerHTML = "🎉 Es isch Bierziit!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("countdown").innerHTML =
        days + " Tage " + hours + " Std " + minutes + " Min " + seconds + " Sek";
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
